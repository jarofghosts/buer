name: ci

# What every push and pull request has to pass: the formatting rustfmt's
# defaults settled in d89eaee, and the tests.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nothing is compiled here, so this needs neither the Linux build
      # dependencies the test job installs nor a cargo cache.
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The test binaries link the plugin crate, which reaches baseview and
      # egui_glow, so the same X11 and OpenGL libraries the bundle job needs
      # have to be here as well — buer-core's tests are the bulk of them, but
      # `--workspace` builds all of it.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-cargo-

      - name: Test
        run: cargo test --workspace
